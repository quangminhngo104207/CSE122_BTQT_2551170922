<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Máy tính đơn giản</title>
    <link rel="stylesheet" href="bai15.css">
</head>
<body>
<main class="calculator">
    <section class="screen">
        <p class="expression" id="expression">&nbsp;</p>
        <p class="result" id="result">0</p>
    </section>

    <section class="keys" id="keys">
        <button type="button" class="key clear" data-key="C">C</button>
        <button type="button" class="key op" data-key="()">( )</button>
        <button type="button" class="key op" data-key="%">%</button>
        <button type="button" class="key op" data-key="÷">&divide;</button>

        <button type="button" class="key num" data-key="7">7</button>
        <button type="button" class="key num" data-key="8">8</button>
        <button type="button" class="key num" data-key="9">9</button>
        <button type="button" class="key op" data-key="x">&times;</button>

        <button type="button" class="key num" data-key="4">4</button>
        <button type="button" class="key num" data-key="5">5</button>
        <button type="button" class="key num" data-key="6">6</button>
        <button type="button" class="key op" data-key="-">&minus;</button>

        <button type="button" class="key num" data-key="1">1</button>
        <button type="button" class="key num" data-key="2">2</button>
        <button type="button" class="key num" data-key="3">3</button>
        <button type="button" class="key op" data-key="+">+</button>

        <button type="button" class="key num zero" data-key="0">0</button>
        <button type="button" class="key num" data-key=".">.</button>
        <button type="button" class="key equal" data-key="=">=</button>
    </section>
</main>

<script src="bai15.js"></script>
</body>
</html>
