<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng điều khiển lớp học phần</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="bai30.css">
</head>
<body>
<div class="wrapper d-flex">
    <aside class="sidebar flex-shrink-0">
        <div class="brand">CSE.TLU Admin</div>
        <nav class="nav flex-column">
            <a class="nav-link active" aria-current="page" href="#">Bảng điều khiển</a>
            <a class="nav-link" href="#">Bài tập</a>
            <a class="nav-link" href="#">Sinh viên</a>
            <a class="nav-link" href="#">Điểm số</a>
        </nav>
    </aside>

    <main class="content flex-grow-1">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
            <h1 class="h3 fw-bold mb-0">Bảng điều khiển <span class="badge bg-warning text-dark align-middle">3 bài mới</span></h1>
            <button type="button" class="btn btn-primary">Xuất báo cáo</button>
        </div>

        <div class="row g-3">
            <div class="col-md-3 col-sm-6">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body">
                        <p class="stat-label mb-1">Sinh viên</p>
                        <h2 class="stat-value">128</h2>
                        <div class="progress" role="progressbar" aria-label="Tiến độ sinh viên" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100">
                            <div class="progress-bar bg-primary" style="width: 75%"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3 col-sm-6">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body">
                        <p class="stat-label mb-1">Đã nộp</p>
                        <h2 class="stat-value">96</h2>
                        <div class="progress" role="progressbar" aria-label="Tiến độ đã nộp" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100">
                            <div class="progress-bar bg-success" style="width: 60%"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3 col-sm-6">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body">
                        <p class="stat-label mb-1">Chưa nộp</p>
                        <h2 class="stat-value">32</h2>
                        <div class="progress" role="progressbar" aria-label="Tiến độ chưa nộp" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100">
                            <div class="progress-bar bg-danger" style="width: 25%"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3 col-sm-6">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body">
                        <p class="stat-label mb-1">Điểm TB</p>
                        <h2 class="stat-value">7.8</h2>
                        <div class="progress" role="progressbar" aria-label="Điểm trung bình" aria-valuenow="78" aria-valuemin="0" aria-valuemax="100">
                            <div class="progress-bar bg-warning" style="width: 78%"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card border-0 shadow-sm mt-4">
            <div class="card-body">
                <h2 class="h6 fw-bold mb-3">Tiến độ theo chương</h2>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item d-flex justify-content-between align-items-center px-0">
                        Chương 1 — HTML5
                        <span class="badge bg-success rounded-pill">100%</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between align-items-center px-0">
                        Chương 2 — JavaScript
                        <span class="badge bg-info rounded-pill">82%</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between align-items-center px-0">
                        Chương 3 — CSS3
                        <span class="badge bg-info rounded-pill">74%</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between align-items-center px-0">
                        Chương 4 — Bootstrap 5
                        <span class="badge bg-secondary rounded-pill">45%</span>
                    </li>
                </ul>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
