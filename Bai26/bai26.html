<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tham gia CLB Lập trình Web</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="bai26.css">
</head>
<body>
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="card border-0 shadow">
                <div class="card-header bg-success text-white text-center py-3">
                    <h1 class="h3 mb-0">Đăng ký tham gia CLB Lập trình Web</h1>
                </div>

                <div class="card-body p-4 p-md-5">
                    <form action="#" method="post">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="hoten" class="form-label">Họ và tên</label>
                                <input type="text" class="form-control" id="hoten" name="hoten" placeholder="Nguyễn Văn A" required>
                            </div>

                            <div class="col-md-6">
                                <label for="masv" class="form-label">Mã sinh viên</label>
                                <input type="text" class="form-control" id="masv" name="masv" placeholder="22xxxxxx" required>
                            </div>

                            <div class="col-md-6">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" name="email" placeholder="sv@tlu.edu.vn" required>
                            </div>

                            <div class="col-md-6">
                                <label for="sdt" class="form-label">Số điện thoại</label>
                                <input type="tel" class="form-control" id="sdt" name="sdt" placeholder="09xxxxxxxx" required>
                            </div>

                            <div class="col-12">
                                <span class="form-label d-block">Trình độ</span>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="trinhdo" id="td1" value="co-ban" checked>
                                    <label class="form-check-label" for="td1">Cơ bản</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="trinhdo" id="td2" value="kha">
                                    <label class="form-check-label" for="td2">Khá</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="trinhdo" id="td3" value="tot">
                                    <label class="form-check-label" for="td3">Tốt</label>
                                </div>
                            </div>

                            <div class="col-12">
                                <label for="lop" class="form-label">Chọn lớp</label>
                                <select class="form-select" id="lop" name="lop" required>
                                    <option value="67CNTT1" selected>67CNTT1</option>
                                    <option value="67CNTT2">67CNTT2</option>
                                    <option value="67KTPM1">67KTPM1</option>
                                    <option value="67KTPM2">67KTPM2</option>
                                </select>
                            </div>

                            <div class="col-12">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="camket" name="camket" checked required>
                                    <label class="form-check-label" for="camket">Tôi cam kết tự làm bài và quay video OBS</label>
                                </div>
                            </div>

                            <div class="col-12 d-grid d-md-flex justify-content-md-end gap-2">
                                <button type="reset" class="btn btn-outline-secondary">Nhập lại</button>
                                <button type="submit" class="btn btn-success">Đăng ký</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
