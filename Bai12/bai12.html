<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In lịch</title>
    <link rel="stylesheet" href="bai12.css">
</head>
<body>
<main class="card">
    <section class="calendar" aria-live="polite">
        <p class="year" id="nam">2026</p>
        <p class="month" id="thang">Tháng 12</p>
        <p class="day" id="ngay">24</p>
        <p class="weekday" id="thu">Thứ hai</p>
    </section>

    <p class="greeting" id="loiChao">Chào buổi sáng!</p>

    <form class="picker" id="formLich">
        <div class="cell">
            <label for="inpNgay">Ngày</label>
            <input type="number" id="inpNgay" name="ngay" min="1" max="31" value="24">
        </div>
        <div class="cell">
            <label for="inpThang">Tháng</label>
            <input type="number" id="inpThang" name="thang" min="1" max="12" value="12">
        </div>
        <div class="cell">
            <label for="inpNam">Năm</label>
            <input type="number" id="inpNam" name="nam" min="1" max="9999" value="2026">
        </div>
        <button type="submit" id="btnIn">In lịch</button>
    </form>
</main>

<script src="bai12.js"></script>
</body>
</html>
