<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên hệ với chúng tôi</title>
    <link rel="stylesheet" href="bai10.css">
</head>
<body>
<main class="card">
    <header class="card-head">
        <h1>Liên hệ với chúng tôi</h1>
        <p>Vui lòng điền thông tin bên dưới, chúng tôi sẽ phản hồi trong 24 giờ.</p>
    </header>

    <form class="card-body" action="#" method="post">
        <div class="grid">
            <div class="field">
                <label for="hoten">Họ và tên</label>
                <input type="text" id="hoten" name="hoten" value="Nguyễn Văn An">
            </div>

            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" value="an.nv@tlu.edu.vn">
            </div>

            <div class="field">
                <label for="sdt">Số điện thoại</label>
                <input type="tel" id="sdt" name="sdt" value="0987 654 321">
            </div>

            <div class="field">
                <label for="chude">Chủ đề</label>
                <select id="chude" name="chude">
                    <option selected>Hỏi về khoá học</option>
                    <option>Góp ý cho website</option>
                    <option>Hợp tác</option>
                    <option>Chủ đề khác</option>
                </select>
            </div>

            <div class="field full">
                <label for="noidung">Nội dung</label>
                <textarea id="noidung" name="noidung" rows="4">Em muốn hỏi về lịch nộp bài tập môn Lập trình Web ạ.</textarea>
            </div>

            <div class="field full consent">
                <input type="checkbox" id="dongy" name="dongy" checked>
                <label for="dongy">Tôi đồng ý nhận email phản hồi.</label>
            </div>

            <div class="field full actions">
                <button type="submit" class="btn-send">Gửi liên hệ</button>
                <button type="reset" class="btn-reset">Nhập lại</button>
            </div>
        </div>
    </form>
</main>
</body>
</html>
